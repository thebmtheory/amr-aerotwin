[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amr-aerotwin"
version = "0.2.0"
description = "Track-data vehicle science for F1: physics-based lap simulation, calibration, grip and energy analysis from public timing data"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Balaji Murugan", email = "thebm.theory@gmail.com" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3", "mypy>=1.9"]

[project.scripts]
aerotwin = "amr_aerotwin.cli:main"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-data]
amr_aerotwin = ["report/static/*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
markers = ["data: tests that need the cached telemetry fixture"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
# Per-event helper closures in the season analyses are only called inside their own loop iteration
"backend/src/amr_aerotwin/pipeline/season.py" = ["B023"]
