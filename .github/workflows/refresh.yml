name: Refresh report

# Rebuilds the analysis after each race weekend and publishes the site to GitHub Pages.
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC, after a Grand Prix weekend
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore telemetry cache
        uses: actions/cache@v4
        with:
          path: data/telemetry_cache
          key: telemetry-${{ github.run_id }}
          restore-keys: telemetry-
      - run: pip install -e .
      - name: Fetch, build, analyse, report
        run: aerotwin all --years 2025 2026
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
