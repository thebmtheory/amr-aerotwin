name: Refresh report

# Rebuilds the analysis from a fresh fetch and publishes the site to the gh-pages branch, which
# GitHub Pages serves. Run it by hand from the Actions tab after a race weekend; the published
# numbers only change when it is run.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore telemetry cache
        uses: actions/cache@v4
        with:
          path: data/telemetry_cache
          key: telemetry-${{ github.run_id }}
          restore-keys: telemetry-
      - run: pip install -e .
      - name: Fetch, build, analyse, report
        run: aerotwin all --years 2025 2026
      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/publish_pages.sh
