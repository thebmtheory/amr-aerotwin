name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check backend
      - name: Tests (offline, uses the bundled Silverstone fixture)
        env:
          AEROTWIN_OFFLINE: "1"
        run: pytest -q backend/tests
